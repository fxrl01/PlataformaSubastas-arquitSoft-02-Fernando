x-high-scale-ulimits: &high-scale-ulimits
  nofile:
    soft: 65535
    hard: 65535

x-api-env: &api-env
  PORT: 3000
  DATABASE_URL: postgres://${POSTGRES_USER:-livebid_admin}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}@livebid-pgbouncer:5432/livebid_db
  READ_DATABASE_URL: ${READ_DATABASE_URL:-}
  DB_MAX_CONNS: ${DB_MAX_CONNS:-40}
  DB_MIN_CONNS: ${DB_MIN_CONNS:-8}
  DB_PGBOUNCER_MODE: "true"
  REDIS_URL: redis://livebid-cache:6379
  REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-128}
  REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-16}
  AUCTION_CACHE_TTL_SEC: ${AUCTION_CACHE_TTL_SEC:-15}
  JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  CIRCUIT_BREAKER_TIMEOUT_MS: ${CIRCUIT_BREAKER_TIMEOUT_MS:-2000}
  CIRCUIT_BREAKER_FAIL_THRESHOLD: ${CIRCUIT_BREAKER_FAIL_THRESHOLD:-3}
  WEB3_CHAIN_ID: ${WEB3_CHAIN_ID:-8453}
  WEB3_ESCROW_CONTRACT: ${WEB3_ESCROW_CONTRACT:-0x000000000000000000000000000000000000dEaD}
  WEB3_RPC_URL: ${WEB3_RPC_URL:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@livebid.pe}
  ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-AdminLiveBid2026!}

services:
  livebid-db:
    image: postgres:16-alpine
    container_name: livebid-postgres
    restart: always
    environment:
      POSTGRES_DB: livebid_db
      POSTGRES_USER: ${POSTGRES_USER:-livebid_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-livebid_admin} -d livebid_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - livebid-net
    ulimits: *high-scale-ulimits

  livebid-pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p0
    container_name: livebid-pgbouncer
    restart: always
    ulimits: *high-scale-ulimits
    environment:
      DB_HOST: livebid-db
      DB_PORT: 5432
      DB_NAME: livebid_db
      DB_USER: ${POSTGRES_USER:-livebid_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-2500}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-40}
      AUTH_TYPE: scram-sha-256
    depends_on:
      livebid-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${DB_USER:-livebid_admin} -d livebid_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - livebid-net

  livebid-cache:
    image: redis:7-alpine
    container_name: livebid-redis
    restart: always
    ulimits: *high-scale-ulimits
    command: ["redis-server", "--appendonly", "yes", "--maxclients", "10000"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - livebid-net

  livebid-api-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: livebid-api-1
    restart: always
    ulimits: *high-scale-ulimits
    environment:
      <<: *api-env
      INSTANCE_ID: livebid-api-1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      livebid-pgbouncer:
        condition: service_healthy
      livebid-cache:
        condition: service_healthy
    networks:
      - livebid-net

  livebid-api-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: livebid-api-2
    restart: always
    ulimits: *high-scale-ulimits
    environment:
      <<: *api-env
      INSTANCE_ID: livebid-api-2
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      livebid-pgbouncer:
        condition: service_healthy
      livebid-cache:
        condition: service_healthy
    networks:
      - livebid-net

  livebid-gateway:
    image: nginx:1.27-alpine
    container_name: livebid-nginx-gateway
    restart: always
    ulimits: *high-scale-ulimits
    ports:
      - "${PORT:-3000}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tecnologia/boilerplate-clean-arquitecture/public:/usr/share/nginx/html:ro
    depends_on:
      livebid-api-1:
        condition: service_healthy
      livebid-api-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - livebid-net

volumes:
  postgres_data:
  redis_data:

networks:
  livebid-net:
    driver: bridge
