<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LiveBid">
  <defs>
    <linearGradient id="lbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d878"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a6f12"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0f1523" stroke="url(#lbGold)" stroke-width="3"/>
  <!-- Base de estrado -->
  <rect x="16" y="45" width="24" height="5" rx="2.5" fill="url(#lbGold)"/>
  <!-- Cabeza y mango del martillo de subasta -->
  <g transform="rotate(-32 31 27)">
    <rect x="20" y="16" width="20" height="10" rx="3" fill="url(#lbGold)"/>
    <rect x="28" y="25" width="4.5" height="20" rx="2.2" fill="#f8fafc"/>
  </g>
  <!-- Punto verde de transmisión en vivo -->
  <circle cx="48" cy="16" r="5.5" fill="#10b981"/>
</svg>
