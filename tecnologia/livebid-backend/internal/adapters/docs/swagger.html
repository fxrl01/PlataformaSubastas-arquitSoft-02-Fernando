<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveBid API Docs — OpenAPI 3.0 / Swagger UI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>
    :root {
      --livebid-bg: #0f1115;
      --livebid-gold: #d4af37;
      --livebid-text: #f3f4f6;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .livebid-doc-banner {
      background: linear-gradient(90deg, #0f1115 0%, #1b2029 100%);
      color: var(--livebid-text);
      padding: 12px 24px;
      border-bottom: 2px solid var(--livebid-gold);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .livebid-doc-banner strong {
      color: var(--livebid-gold);
      letter-spacing: 0.04em;
    }
    .livebid-doc-links {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 13px;
    }
    .livebid-doc-links a {
      color: #e5e7eb;
      text-decoration: none;
      border: 1px solid rgba(212, 175, 55, 0.45);
      padding: 5px 10px;
      border-radius: 6px;
    }
    .livebid-doc-links a:hover {
      background: rgba(212, 175, 55, 0.16);
      color: #ffffff;
    }
    .swagger-ui .topbar {
      display: none;
    }
  </style>
</head>
<body>
  <header class="livebid-doc-banner">
    <div>
      <strong>LIVEBID — API REST &amp; WEBSOCKET</strong>
      <span> • Documentación Interactiva OpenAPI 3.0.3 (Clean Architecture Go 1.23)</span>
    </div>
    <nav class="livebid-doc-links" aria-label="Enlaces OpenAPI">
      <a href="/api/v1/openapi.json" target="_blank" rel="noopener noreferrer">JSON Spec</a>
      <a href="/api/v1/openapi.yaml" target="_blank" rel="noopener noreferrer">YAML Spec</a>
      <a href="/">Volver a Sala en Vivo</a>
    </nav>
  </header>

  <main id="swagger-ui"></main>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.addEventListener('load', function () {
      if (typeof window.SwaggerUIBundle !== 'function') {
        document.getElementById('swagger-ui').innerHTML =
          '<p style="padding:24px;font-family:sans-serif;">No se pudo cargar Swagger UI desde CDN. Descargue el contrato directamente en <a href="/api/v1/openapi.json">/api/v1/openapi.json</a> o <a href="/api/v1/openapi.yaml">/api/v1/openapi.yaml</a>.</p>';
        return;
      }
      window.ui = window.SwaggerUIBundle({
        url: '/api/v1/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        displayRequestDuration: true,
        filter: true,
        persistAuthorization: true,
        presets: [
          window.SwaggerUIBundle.presets.apis,
          window.SwaggerUIStandalonePreset
        ],
        layout: 'StandaloneLayout'
      });
    });
  </script>
</body>
</html>
