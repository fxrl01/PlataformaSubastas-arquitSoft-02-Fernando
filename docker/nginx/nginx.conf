worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream livebid_api_cluster {
        server livebid-api-1:3000 max_fails=3 fail_timeout=10s;
        server livebid-api-2:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # WebSocket Hub multiplexado hacia el cluster Go (Redis Pub/Sub sincroniza réplicas)
        location /ws/ {
            proxy_pass http://livebid_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # API REST balanceada entre réplicas stateless
        location /api/ {
            proxy_pass http://livebid_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Upstream-Server $upstream_addr always;
        }

        location = /health {
            proxy_pass http://livebid_api_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header X-Upstream-Server $upstream_addr always;
        }

        # Activos estáticos del Frontend SPA desacoplados con caché HTTP
        location ~* \.(css|js|png|jpg|jpeg|svg|webp|woff2?)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Static-Layer "nginx-frontend-cache" always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Static-Layer "nginx-frontend-spa" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
