name: LiveBid CD — GHCR Image & Azure VM Deploy

on:
  push:
    branches: [main, release-publica]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push LiveBid Image to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize lowercase image repository name
        id: img
        run: |
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${LOWER_REPO}/livebid-api" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image summary
        run: |
          {
            echo "### Imagen Docker Publicada en GitHub Container Registry (GHCR)"
            echo "- Repositorio: \`${{ env.REGISTRY }}/${{ steps.img.outputs.name }}\`"
            echo "- Rama origen: \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-azure-vm:
    name: Deploy to Microsoft Azure VM (SSH + Cloudflare Origin)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ vars.ENABLE_AZURE_DEPLOY == 'true' }}

    steps:
      - name: Deploy via SSH to Azure Virtual Machine
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            cd ${{ secrets.AZURE_DEPLOY_PATH }}
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            APP_ENV=production docker compose up -d --build --wait
            docker image prune -f
